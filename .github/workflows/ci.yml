# Continuous integration (docs/05-open-questions.md, Q22).
# Runs on pull requests, and by hand from the Actions tab on any branch ("Run workflow").
# Direct pushes to main are tested locally before the push; releases run the tests again.
name: CI

on:
  pull_request:
  workflow_dispatch:

# A new push to the same pull request cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Unit tests, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      # Gradle caches through setup-java: open source, no extra terms (Q22).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Domain tests, app unit tests, lint, debug APK
        run: ./gradlew :domain:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Keep the reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: checks-reports
          path: android/*/build/reports/

  device-tests:
    name: UI tests on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      API_LEVEL: 34
    steps:
      - uses: actions/checkout@v7

      # Gradle caches through setup-java: open source, no extra terms (Q22).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # Hardware acceleration for the emulator: the Linux runners have KVM, but it must be opened to the runner user.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator image and a booted snapshot are kept between runs, which saves most of the boot time.
      - name: Restore the emulator
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}

      - name: Create the emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Emulator snapshot created."

      - name: UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: android
          script: ./gradlew :app:connectedDebugAndroidTest

      - name: Keep the reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: device-test-reports
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
